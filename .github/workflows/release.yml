name: Build and Release

on:
  push:
    branches: [main]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: spectral-linux-x86_64
          - os: windows-latest
            artifact: spectral-windows-x86_64.exe
          - os: macos-13
            artifact: spectral-macos-x86_64
          - os: macos-latest
            artifact: spectral-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PortAudio (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libportaudio2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: >-
          python -m PyInstaller
          --onefile
          --name spectral
          --collect-all textual
          --collect-all sounddevice
          --hidden-import miniaudio
          main.py

      - name: Rename artifact (Unix)
        if: runner.os != 'Windows'
        run: mv dist/spectral "dist/${{ matrix.artifact }}"

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Move-Item dist\spectral.exe "dist\${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-$(git rev-parse --short HEAD)"
          gh release create "$TAG" dist/* \
            --title "Build ${TAG}" \
            --notes "Automated release from [\`${GITHUB_SHA}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})"
